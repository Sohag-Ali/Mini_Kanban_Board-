name: mini-kanban

services:
  # 1. PostgreSQL Database Service (Local Containerized DB)
  postgres:
    image: postgres:16-alpine
    container_name: mini_kanban_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mini_kanban
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mini_kanban"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Express & Prisma Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mini_kanban_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/mini_kanban?schema=public
      JWT_ACCESS_SECRET: docker_local_dev_access_secret_key_123456789
      JWT_REFRESH_SECRET: docker_local_dev_refresh_secret_key_123456789
      JWT_ACCESS_EXPIRES_IN: 1d
      JWT_REFRESH_EXPIRES_IN: 7d
      BCRYPT_SALT_ROUNDS: 10
      FRONTEND_URL: http://localhost:3000
      BACKEND_URL: http://localhost:5000
    depends_on:
      postgres:
        condition: service_healthy

  # 3. Next.js Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5000/api/v1
    container_name: mini_kanban_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:5000/api/v1
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
